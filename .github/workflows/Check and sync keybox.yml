name: Check & Sync All strong Keybox Sources

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install cryptography requests

      - name: Download & verify keyboxes against Google Revocation List
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import shutil
          import glob
          import xml.etree.ElementTree as ET
          import requests
          import base64
          from cryptography import x509
          from cryptography.hazmat.backends import default_backend

          # Hàm tự động kiểm tra và giải mã Base64 nếu cần
          def decode_if_base64(content):
              content_stripped = content.strip()
              # Nếu nội dung bắt đầu bằng '<' thì khả năng cao là XML thuần, không cần giải mã
              if content_stripped.startswith('<'):
                  return content
              try:
                  # Thử giải mã Base64
                  decoded_bytes = base64.b64decode(content_stripped)
                  decoded_str = decoded_bytes.decode('utf-8')
                  # Nếu sau khi giải mã bắt đầu bằng '<' thì trả về XML đã giải mã
                  if decoded_str.strip().startswith('<'):
                      return decoded_str
              except Exception:
                  pass
              # Trả về nguyên gốc nếu không phải Base64 hoặc giải mã lỗi
              return content

          # 1. Danh sách các URL đơn lẻ bên ngoài (dạng raw) - Đã thêm nguồn kezz base64
          SINGLE_SOURCES = [
              ("Yurii0307_keybox.xml", "https://raw.githubusercontent.com/Yurii0307/yurikey/main/key"),
              ("evoker_keybox.xml", "https://evoker.qzz.io/key"),
              ("soctrungkien_kezz_keybox.xml", "https://raw.githubusercontent.com/soctrungkien/1HzH9Axaj/refs/heads/main/kezz"),                          
              ("GueRapii_keybox.xml", "https://raw.githubusercontent.com/GueRapii/randommodulesfiles/refs/heads/main/file.enc"),
              ("PixelLineage_keybox.xml", "https://raw.githubusercontent.com/PixelLineage/res/main/certified_bundle/keybox.xml"),
              ("loonage_keybox.xml", "https://raw.githubusercontent.com/loonage/ota/los-23/spoofify/keybox.xml"),
              ("PallabKumarS_keybox.xml", "https://raw.githubusercontent.com/PallabKumarS/android-mods/main/modules/playintegrity-trickystore-aio/keybox.xml"),
              ("EvolutionX_keybox.xml", "https://git.evolution-x.org/EvoX/keybox/raw/branch/main/keybox.xml"),
              ("Sul6666_key.xml", "https://raw.githubusercontent.com/Sul6666/msup/main/key.xml"),
              ("zuri1503_keybox.xml", "https://raw.githubusercontent.com/zuri1503/Toolbox-Database/main/keybox.xml"),
              ("lucnguyen06_keybox.xml", "https://raw.githubusercontent.com/lucnguyen06/keybox/main/keybox/keybox.xml"),
              ("AresOS_keybox.xml", "https://raw.githubusercontent.com/AresOS-AOSP/.github/main/profile/keybox.xml"),
              ("davidepalma_keybox.xml", "https://www.davidepalma.it/pib/keybox.xml"),
              ("dare_devil_ex_keybox.xml", "https://raw.githubusercontent.com/dare-devil-ex/keyboxxBot/main/keybox.xml"),
              ("GreyElaina_kb_b.xml", "https://gist.githubusercontent.com/GreyElaina/2401596f3b8a01f8602768ad5221e2fd/raw/kb_b.xml"),
              ("mywoopies_keystore.xml", "https://raw.githubusercontent.com/mywoopies/mejson/refs/heads/main/keystore.xml"),
          ]

          # 2. Tải danh sách Google CRL
          CRL_URL = "https://android.googleapis.com/attestation/status"
          print("[*] Đang tải Google Attestation CRL...")
          try:
              r = requests.get(CRL_URL, timeout=15)
              r.raise_for_status()
              crl_data = r.json()
              revoked_entries = crl_data.get("entries", {})
              print(f"[+] Tải CRL thành công ({len(revoked_entries)} serial bị revoked).")
          except Exception as e:
              print(f"[!] Không thể tải Google CRL: {e}")
              sys.exit(1)

          def is_keybox_valid(xml_content):
              """Kiểm tra certificate trong keybox XML xem có bị Google revoked không."""
              try:
                  root = ET.fromstring(xml_content)
                  certs = root.findall(".//Certificate")
                  if not certs:
                      return False, "Không có thẻ Certificate"

                  cert_pem = certs[0].text.strip()
                  if not cert_pem.startswith("-----BEGIN"):
                      cert_pem = f"-----BEGIN CERTIFICATE-----\n{cert_pem}\n-----END CERTIFICATE-----"

                  parsed_cert = x509.load_pem_x509_certificate(cert_pem.encode(), default_backend())
                  serial_hex = format(parsed_cert.serial_number, 'x').lower()

                  if serial_hex in revoked_entries:
                      status = revoked_entries[serial_hex].get("reason", "REVOKED")
                      return False, f"Revoked (Serial: {serial_hex}, Lý do: {status})"
                  return True, f"Valid (Serial: {serial_hex})"
              except Exception as err:
                  return False, f"Lỗi parse: {err}"

          valid_keyboxes = {}

          # 3. Quét và kiểm tra các keybox HIỆN CÓ trong chính repo này (Toolbox-data/Keybox/)
          local_dir = os.path.join("Toolbox-data", "Keybox")
          print("\n[*] Đang kiểm tra các keybox hiện có sẵn trong repo...")
          if os.path.exists(local_dir):
              for fpath in glob.glob(os.path.join(local_dir, "*.xml")):
                  fname = os.path.basename(fpath)
                  print(f"--> Kiểm tra file nội bộ: {fname}")
                  try:
                      with open(fpath, "r", encoding="utf-8") as f:
                          content = f.read()
                      
                      # Vẫn gọi decode_if_base64 phòng trường hợp file lưu sẵn bị mã hóa
                      xml_content = decode_if_base64(content)
                      is_valid, msg = is_keybox_valid(xml_content)
                      if is_valid:
                          print(f"    [+] VẪN CÒN STRONG: {msg}")
                          valid_keyboxes[fname] = xml_content
                      else:
                          print(f"    [-] ĐÃ CHẾT / REVOKED -> SẼ BỊ LOẠI BỎ: {msg}")
                  except Exception as e:
                      print(f"    [!] Lỗi đọc file {fname}: {e}")

          # 4. Quét các URL đơn lẻ bên ngoài
          print("\n[*] Đang kiểm tra danh sách nguồn đơn lẻ...")
          for fname, url in SINGLE_SOURCES:
              print(f"--> Kiểm tra nguồn: {fname}")
              try:
                  res = requests.get(url, timeout=15)
                  if res.status_code == 200:
                      # Gọi hàm giải mã Base64 tại đây
                      xml_content = decode_if_base64(res.text)
                      is_valid, msg = is_keybox_valid(xml_content)
                      if is_valid:
                          print(f"    [+] STRONG: {msg}")
                          valid_keyboxes[fname] = xml_content
                      else:
                          print(f"    [-] LOẠI: {msg}")
                  else:
                      print(f"    [!] Tải thất bại (HTTP {res.status_code})")
              except Exception as e:
                  print(f"    [!] Lỗi kết nối: {e}")

          # 5. Quét thư mục IBDump/IBStrong/Keybox
          print("\n[*] Đang kiểm tra thư mục IBDump/IBStrong/Keybox...")
          API_URL = "https://api.github.com/repos/IBDump/IBStrong/contents/Keybox"
          headers = {}
          gh_token = os.environ.get("GITHUB_TOKEN")
          if gh_token:
              headers["Authorization"] = f"token {gh_token}"

          try:
              res = requests.get(API_URL, headers=headers, timeout=15)
              if res.status_code == 200:
                  for item in res.json():
                      fname = item.get("name", "")
                      download_url = item.get("download_url")
                      if not fname.endswith(".xml") or not download_url:
                          continue

                      dest_name = f"IBStrong_{fname}"
                      print(f"--> Kiểm tra IBDump: {fname}")
                      f_res = requests.get(download_url, timeout=15)
                      if f_res.status_code == 200:
                          # Gọi hàm giải mã Base64 tại đây
                          xml_content = decode_if_base64(f_res.text)
                          is_valid, msg = is_keybox_valid(xml_content)
                          if is_valid:
                              print(f"    [+] STRONG: {msg}")
                              valid_keyboxes[dest_name] = xml_content
                          else:
                              print(f"    [-] LOẠI: {msg}")
              else:
                  print(f"[!] Không thể đọc repo IBDump (HTTP {res.status_code})")
          except Exception as e:
              print(f"[!] Lỗi khi quét IBDump: {e}")

          # 6. Dọn dẹp thư mục cũ và chỉ ghi lại các keybox còn STRONG
          target_dir = os.path.join("Toolbox-data", "Keybox")
          if os.path.exists(target_dir):
              shutil.rmtree(target_dir)
          os.makedirs(target_dir, exist_ok=True)

          if not valid_keyboxes:
              print("\n[!] Không còn bất kỳ keybox nào sống sót!")
              fallback = os.path.join("Toolbox-data", "Keybox.xml")
              if os.path.exists(fallback):
                  os.remove(fallback)
              sys.exit(0)

          for fname, content in valid_keyboxes.items():
              fpath = os.path.join(target_dir, fname)
              with open(fpath, "w", encoding="utf-8") as f:
                  f.write(content) # Sẽ ghi XML bình thường nhờ đã giải mã
              print(f"[✓] Đã giữ lại/thêm mới: {fpath}")

          # Cập nhật file fallback Keybox.xml bằng một file còn sống
          first_key = next(iter(valid_keyboxes))
          default_file = os.path.join("Toolbox-data", "Keybox.xml")
          with open(default_file, "w", encoding="utf-8") as f:
              f.write(valid_keyboxes[first_key])
          print(f"[✓] Đã cập nhật file mặc định: {default_file} (từ {first_key})")

          print(f"\n[Summary] Tổng cộng {len(valid_keyboxes)} keybox còn STRONG được lưu trữ.")
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add -A Toolbox-data/

          if git diff --staged --quiet; then
            echo "Dữ liệu không có thay đổi mới."
            exit 0
          fi

          git commit -m "Auto sync: Lọc bỏ keybox chết, cập nhật danh sách STRONG và hỗ trợ giải mã Base64"
          git pull --rebase -X theirs origin main
          git push origin main
