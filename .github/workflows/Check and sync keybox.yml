name: Check & Sync All strong Keybox Sources

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install cryptography requests

      - name: Download & verify keyboxes against Google Revocation List
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys
          import shutil
          import glob
          import base64
          import requests
          import xml.etree.ElementTree as ET
          from xml.dom import minidom
          from datetime import datetime, timezone
          from cryptography import x509
          from cryptography.hazmat.backends import default_backend

          # Hàm chuẩn hóa XML Keybox (xóa rác, chuẩn hóa mọi loại header PEM)
          def format_keybox_xml(xml_string):
              start_idx = xml_string.find('<AndroidAttestation>')
              if start_idx != -1:
                  xml_string = xml_string[start_idx:]

              try:
                  root = ET.fromstring(xml_string)

                  for elem in root.iter():
                      if elem.text and '-----BEGIN' in elem.text:
                          match = re.search(
                              r'(-----BEGIN [A-Z0-9 ]+-----)(.*?)(-----END [A-Z0-9 ]+-----)',
                              elem.text,
                              flags=re.DOTALL,
                          )
                          if match:
                              header = match.group(1).strip()
                              raw_data = "".join(match.group(2).split())
                              footer = match.group(3).strip()
                              formatted_data = "\n".join(
                                  [raw_data[i:i+64] for i in range(0, len(raw_data), 64)]
                              )
                              elem.text = f"\n{header}\n{formatted_data}\n{footer}\n      "

                  rough_string = ET.tostring(root, 'utf-8')
                  reparsed = minidom.parseString(rough_string)
                  pretty_xml = '\n'.join(
                      [line for line in reparsed.toprettyxml(indent="  ").split('\n') if line.strip()]
                  )
                  return pretty_xml
              except Exception as e:
                  print(f"      [Cảnh báo] Không thể chuẩn hóa định dạng XML: {e}")
                  return xml_string

          # Hàm tự động kiểm tra và giải mã Base64 nếu cần
          def decode_if_base64(content):
              content_stripped = content.strip()
              if content_stripped.startswith('<'):
                  return content
              try:
                  decoded_bytes = base64.b64decode(content_stripped)
                  decoded_str = decoded_bytes.decode('utf-8')
                  if '<AndroidAttestation>' in decoded_str:
                      return decoded_str
              except Exception:
                  pass
              return content

          # 1. Danh sách các URL đơn lẻ bên ngoài
          SINGLE_SOURCES = [
              ("Yurii0307_keybox.xml", "https://raw.githubusercontent.com/Yurii0307/yurikey/main/key"),
              ("evoker_keybox.xml", "https://evoker.qzz.io/key"),
              ("soctrungkien_kezz_keybox.xml", "https://raw.githubusercontent.com/soctrungkien/1HzH9Axaj/refs/heads/main/kezz"),
              ("CollectionByCharlie_keybox.xml", "https://raw.githubusercontent.com/GueRapii/randommodulesfiles/refs/heads/main/file.enc"),
              ("PixelLineage_keybox.xml", "https://raw.githubusercontent.com/PixelLineage/res/main/certified_bundle/keybox.xml"),
              ("hunter_keybox.xml", "https://raw.githubusercontent.com/xorkm25584/hunter/refs/heads/main/dsjgij4345e.xml"),
              ("loonage_keybox.xml", "https://raw.githubusercontent.com/loonage/ota/los-23/spoofify/keybox.xml"),
              ("PallabKumarS_keybox.xml", "https://raw.githubusercontent.com/PallabKumarS/android-mods/main/modules/playintegrity-trickystore-aio/keybox.xml"),
              ("DerpFest-AOSP_keybox.xml", "https://raw.githubusercontent.com/DerpFest-AOSP/DerpSite/refs/heads/master/public/keybox.xml"),
              ("EvolutionX_keybox.xml", "https://git.evolution-x.org/EvoX/keybox/raw/branch/main/keybox.xml"),
              ("Sul6666_key.xml", "https://raw.githubusercontent.com/Sul6666/msup/main/key.xml"),
              ("zuri1503_keybox.xml", "https://raw.githubusercontent.com/zuri1503/Toolbox-Database/main/keybox.xml"),
              ("lucnguyen06_keybox.xml", "https://raw.githubusercontent.com/lucnguyen06/keybox/main/keybox/keybox.xml"),
              ("AresOS_keybox.xml", "https://raw.githubusercontent.com/AresOS-AOSP/.github/main/profile/keybox.xml"),
              ("davidepalma_keybox.xml", "https://www.davidepalma.it/pib/keybox.xml"),
              ("dare_devil_ex_keybox.xml", "https://raw.githubusercontent.com/dare-devil-ex/keyboxxBot/main/keybox.xml"),
              ("GreyElaina_kb_b.xml", "https://gist.githubusercontent.com/GreyElaina/2401596f3b8a01f8602768ad5221e2fd/raw/kb_b.xml"),
              ("mywoopies_keystore.xml", "https://raw.githubusercontent.com/mywoopies/mejson/refs/heads/main/keystore.xml"),
              ("UN1CA-SM7150_keybox.xml", "https://raw.githubusercontent.com/Arnav3078/UN1CA-SM7150/refs/heads/un1ca-5.2.0/target/m51/patches/tweaks/system/etc/security/keybox.xml"),
          ]

          # 2. Tải danh sách Google CRL và chuẩn hóa serial key
          CRL_URL = "https://android.googleapis.com/attestation/status"
          print("[*] Đang tải Google Attestation CRL...")
          try:
              r = requests.get(CRL_URL, timeout=15)
              r.raise_for_status()
              raw_entries = r.json().get("entries", {})
              revoked_entries = {
                  k.strip().lower().lstrip("0") or "0": v
                  for k, v in raw_entries.items()
              }
              print(f"[+] Tải CRL thành công ({len(revoked_entries)} serial bị revoked/suspended).")
          except Exception as e:
              print(f"[!] Không thể tải Google CRL: {e}")
              sys.exit(1)

          def process_xml_content(raw_content):
              """Giải mã, chuẩn hóa và kiểm tra toàn bộ chuỗi chứng chỉ + trạng thái CRL"""
              decoded = decode_if_base64(raw_content)
              formatted_xml = format_keybox_xml(decoded)

              # 1. Kiểm tra sự tồn tại của Private Key (EC, RSA hoặc PKCS#8)
              if not re.search(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----", formatted_xml):
                  return False, "Thiếu Private Key hợp lệ", formatted_xml

              # 2. Trích xuất TOÀN BỘ chứng chỉ có trong XML (Leaf -> Intermediate -> Root)
              cert_pems = re.findall(
                  r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",
                  formatted_xml,
                  flags=re.DOTALL,
              )
              if not cert_pems:
                  return False, "Không tìm thấy thẻ Certificate nào", formatted_xml

              now = datetime.now(timezone.utc)
              leaf_serial = "unknown"

              for idx, pem in enumerate(cert_pems):
                  try:
                      parsed_cert = x509.load_pem_x509_certificate(
                          pem.encode("utf-8"), default_backend()
                      )
                  except Exception as err:
                      return False, f"Lỗi parse chứng chỉ #{idx + 1}: {err}", formatted_xml

                  serial_hex = format(parsed_cert.serial_number, "x").lower()
                  if idx == 0:
                      leaf_serial = serial_hex

                  # 3. Đối chiếu từng chứng chỉ trong chuỗi với Google CRL
                  if serial_hex in revoked_entries:
                      entry = revoked_entries[serial_hex]
                      status = entry.get("status", "REVOKED")
                      reason = entry.get("reason", "UNSPECIFIED")
                      return (
                          False,
                          f"Bị chặn ở cert #{idx + 1} (Serial: {serial_hex} | {status}: {reason})",
                          formatted_xml,
                      )

                  # 4. Kiểm tra thời hạn hiệu lực của chứng chỉ
                  if now < parsed_cert.not_valid_before_utc:
                      return (
                          False,
                          f"Cert #{idx + 1} chưa có hiệu lực (từ {parsed_cert.not_valid_before_utc.date()})",
                          formatted_xml,
                      )
                  if now > parsed_cert.not_valid_after_utc:
                      return (
                          False,
                          f"Cert #{idx + 1} đã hết hạn (vào {parsed_cert.not_valid_after_utc.date()})",
                          formatted_xml,
                      )

              return (
                  True,
                  f"Valid ({len(cert_pems)} certs, Leaf Serial: {leaf_serial})",
                  formatted_xml,
              )

          valid_keyboxes = {}

          # 3. Quét và kiểm tra các keybox HIỆN CÓ trong chính repo này
          local_dir = os.path.join("Toolbox-data", "Keybox")
          print("\n[*] Đang kiểm tra các keybox hiện có sẵn trong repo...")
          if os.path.exists(local_dir):
              for fpath in glob.glob(os.path.join(local_dir, "*.xml")):
                  fname = os.path.basename(fpath)
                  print(f"--> Kiểm tra file nội bộ: {fname}")
                  try:
                      with open(fpath, "r", encoding="utf-8") as f:
                          content = f.read()

                      is_valid, msg, final_xml = process_xml_content(content)
                      if is_valid:
                          print(f"    [+] VẪN CÒN STRONG: {msg}")
                          valid_keyboxes[fname] = final_xml
                      else:
                          print(f"    [-] ĐÃ CHẾT / REVOKED -> SẼ BỊ LOẠI BỎ: {msg}")
                  except Exception as e:
                      print(f"    [!] Lỗi đọc file {fname}: {e}")

          # 4. Quét các URL đơn lẻ bên ngoài
          print("\n[*] Đang kiểm tra danh sách nguồn đơn lẻ...")
          for fname, url in SINGLE_SOURCES:
              print(f"--> Kiểm tra nguồn: {fname}")
              try:
                  res = requests.get(url, timeout=15)
                  if res.status_code == 200:
                      is_valid, msg, final_xml = process_xml_content(res.text)
                      if is_valid:
                          print(f"    [+] STRONG: {msg}")
                          valid_keyboxes[fname] = final_xml
                      else:
                          print(f"    [-] LOẠI: {msg}")
                  else:
                      print(f"    [!] Tải thất bại (HTTP {res.status_code})")
              except Exception as e:
                  print(f"    [!] Lỗi kết nối: {e}")

          # 5. Quét thư mục IBDump/IBStrong/Keybox
          print("\n[*] Đang kiểm tra thư mục IBDump/IBStrong/Keybox...")
          API_URL = "https://api.github.com/repos/IBDump/IBStrong/contents/Keybox"
          headers = {}
          gh_token = os.environ.get("GITHUB_TOKEN")
          if gh_token:
              headers["Authorization"] = f"token {gh_token}"

          try:
              res = requests.get(API_URL, headers=headers, timeout=15)
              if res.status_code == 200:
                  for item in res.json():
                      fname = item.get("name", "")
                      download_url = item.get("download_url")
                      if not fname.endswith(".xml") or not download_url:
                          continue

                      dest_name = f"IBStrong_{fname}"
                      print(f"--> Kiểm tra IBDump: {fname}")
                      f_res = requests.get(download_url, timeout=15)
                      if f_res.status_code == 200:
                          is_valid, msg, final_xml = process_xml_content(f_res.text)
                          if is_valid:
                              print(f"    [+] STRONG: {msg}")
                              valid_keyboxes[dest_name] = final_xml
                          else:
                              print(f"    [-] LOẠI: {msg}")
              else:
                  print(f"[!] Không thể đọc repo IBDump (HTTP {res.status_code})")
          except Exception as e:
              print(f"[!] Lỗi khi quét IBDump: {e}")

          # 6. Dọn dẹp thư mục cũ và chỉ ghi lại các keybox còn STRONG
          target_dir = os.path.join("Toolbox-data", "Keybox")
          if os.path.exists(target_dir):
              shutil.rmtree(target_dir)
          os.makedirs(target_dir, exist_ok=True)

          if not valid_keyboxes:
              print("\n[!] Không còn bất kỳ keybox nào sống sót!")
              fallback = os.path.join("Toolbox-data", "Keybox.xml")
              if os.path.exists(fallback):
                  os.remove(fallback)
              sys.exit(0)

          for fname, content in valid_keyboxes.items():
              fpath = os.path.join(target_dir, fname)
              with open(fpath, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"[✓] Đã giữ lại/thêm mới: {fpath}")

          # Cập nhật file fallback Keybox.xml bằng một file còn sống
          first_key = next(iter(valid_keyboxes))
          default_file = os.path.join("Toolbox-data", "Keybox.xml")
          with open(default_file, "w", encoding="utf-8") as f:
              f.write(valid_keyboxes[first_key])
          print(f"[✓] Đã cập nhật file mặc định: {default_file} (từ {first_key})")

          print(f"\n[Summary] Tổng cộng {len(valid_keyboxes)} keybox còn STRONG được lưu trữ.")
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add -A Toolbox-data/

          if git diff --staged --quiet; then
            echo "Dữ liệu không có thay đổi mới."
            exit 0
          fi

          git commit -m "Auto sync: Giải mã Base64, chuẩn hóa XML và lọc keybox sống"
          git pull --rebase -X theirs origin main
          git push origin main
          
